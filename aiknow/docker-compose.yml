version: "3.8"

services:
  aiknow:
    build: .
    container_name: aiknow
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    environment:
      - AIKNOW_CONFIG=/app/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama（可选 - 本地LLM部署）
  ollama:
    image: ollama/ollama:latest
    container_name: aiknow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    profiles:
      - local-llm
    restart: unless-stopped
