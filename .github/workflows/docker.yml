name: Docker

on:
  push:
    branches: [ main ]
    paths:
      - "aiknow/**"
      - "aiknow/Dockerfile"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: aiknow
          file: aiknow/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aiknow:latest
            ${{ secrets.DOCKER_USERNAME }}/aiknow:v2.0.0
