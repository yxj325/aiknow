name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r aiknow/requirements.txt

    - name: Run RAG unit tests
      run: |
        python aiknow/tests/test_rag.py

    - name: Run API integration tests
      run: |
        python aiknow/tests/test_api.py

    - name: Verify imports
      run: |
        python -c "import sys; sys.path.insert(0,'aiknow'); from app.rag.pipeline import RAGPipeline; p=RAGPipeline({}); print(f'RAG pipeline OK: LLM={p.stats["llm_provider"]}')"